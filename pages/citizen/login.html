<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Login - JanSeva CRM</title>
    <!-- Supabase Configuration (CREATE THIS FILE) -->
    <script src="assets/js/config.js"></script>
    
    <!-- Supabase Client Helper -->
    <script src="assets/js/supabase-client.js"></script>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/components.css">
    <link rel="stylesheet" href="../../assets/css/citizen.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-comment-dots"></i>
                    <span>JanSeva CRM</span>
                </div>
                <h2>Citizen Login</h2>
                <p>Login to track and manage your complaints</p>
            </div>

            <form class="login-form" data-role="citizen">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

          
            <div class="login-footer">
                <p>New to JanSeva? <a href="#">Register here</a></p>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <a href="../../index.html" style="color: var(--gray);">
                    <i class="fas fa-arrow-left"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/auth.js"></script>
</body>
</html>
